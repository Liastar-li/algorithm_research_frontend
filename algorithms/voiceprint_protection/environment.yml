name: vpp
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip>=23.0
  - ffmpeg            # 系统级音频工具：whisper/faster-whisper 读非 wav 格式时需要
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.4.1+cu121
      - torchaudio==2.4.1+cu121
      - numpy==1.26.4
      - scipy==1.13.1
      - librosa==0.10.2.post1
      - soundfile==0.12.1
      - soxr==0.3.7
      - tqdm==4.66.4
      - tensorboard==2.16.2
      - matplotlib==3.8.4
      - fastapi==0.110.3
      - uvicorn[standard]==0.30.1
      - python-multipart==0.0.9
      - pydantic==2.7.4
      - requests==2.32.3
      - huggingface_hub==0.24.6
      - tokenizers==0.19.1
      - ctranslate2==4.5.0
      - faster-whisper==1.1.0
      - jiwer==3.0.4
      - numba==0.60.0
      - llvmlite==0.43.0
