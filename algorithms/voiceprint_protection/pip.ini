; ============================================================================
; 语音声纹主动防御 · pip 镜像配置模板
;
; 【用法】复制到你的 pip 配置目录，然后按需修改：
;     Windows : %APPDATA%\pip\pip.ini
;     Linux/macOS : ~/.pip/pip.ini 或 ~/.config/pip/pip.ini
;
; 【最快的方式】（不用手动建文件，直接执行这两条，效果等价）：
;     pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
;
; 【想同时让 pip 默认拿到 CUDA 版 torch】（可选，推荐）
;     pip config set global.extra-index-url https://mirror.nju.edu.cn/pytorch/whl/cu121/
;     装完后 torch.__version__ 会带 "+cu121" 后缀（2.4.1+cu121 > 2.4.1，pip 会选高的）。
;
; 【确认生效】
;     pip config list
; ============================================================================

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
timeout = 60

; 国内 PyPI 镜像备选（一个一个试，哪个快用哪个）：
; index-url = https://mirrors.aliyun.com/pypi/simple/
; index-url = https://mirrors.cloud.tencent.com/pypi/simple/
; index-url = https://repo.huaweicloud.com/repository/pypi/simple/

; 让 pip 默认就能拿到 CUDA 版 torch（南京大学镜像，已实测 sha256 与官方一致）
; extra-index-url = https://mirror.nju.edu.cn/pytorch/whl/cu121/

[install]
; 下载慢时增大超时；卡住可 Ctrl+C 后重跑，已装的会自动跳过
timeout = 60
retries = 5
